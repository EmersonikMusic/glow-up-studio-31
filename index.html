  <!-- Critical: SettingsPanel / ProfilePanel closed-state visibility. Duplicated in
       src/index.css. Inlined here so the CSSOM has the closed rules before React
       renders — the panel exists in-place but is fully transparent and unhittable
       until data-open="true" flips. An 80ms open-delay on opacity guarantees the
       panel stays invisible until the user has clearly interacted. Keep in sync
       with src/index.css. -->
  <style data-critical="settings-panel">
    .settings-sheet-mobile,.settings-sheet-desktop{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease-out,visibility 0s linear .18s}
    .settings-sheet-mobile[data-open="true"],.settings-sheet-desktop[data-open="true"]{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease-out .08s,visibility 0s linear 0s}
    .settings-sheet-mobile{height:85vh;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .18s ease-out,visibility 0s linear .28s}
    @supports (height:100svh){.settings-sheet-mobile{height:85svh}}
    @supports (height:100dvh){.settings-sheet-mobile{height:85dvh}}
    .settings-sheet-mobile[data-open="true"]{transform:translateY(0);transition:transform .34s cubic-bezier(.32,.72,0,1),opacity .2s ease-out,visibility 0s linear 0s}
    .settings-sheet-mobile[data-ready="false"]{transition:none !important}
  </style>
